<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="layout">
    <header>
      <h1>Snake</h1>
      <p class="subtitle">Use the arrow keys or WASD to guide the snake and collect fruit.</p>
    </header>

    <section class="panel">
      <div class="status">
        <div>
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div id="state" class="state">Press Start to play</div>
      </div>
      <div class="controls">
        <button id="start">Start / Restart</button>
      </div>
      <canvas id="board" width="420" height="420" aria-label="Snake game board"></canvas>
      <p class="hint">Avoid running into walls or your tail. Eating fruit grows the snake and raises your score.</p>
    </section>
  </main>

  <script src="snake.js"></script>
</body>
</html>
